<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja · Arena Prime</title>
<meta name="description" content="Cartas avulsas e produtos lacrados de One Piece, Pokémon, Magic e board games na Arena Prime, em Florianópolis.">
<meta property="og:type" content="website">
<meta property="og:title" content="Loja · Arena Prime">
<meta property="og:description" content="Cartas avulsas e produtos lacrados. Pedido fechado pelo WhatsApp.">
<meta property="og:image" content="https://arenasiteindex-hmtl.vercel.app/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/arena.css?v=20261019c">
</head>
<body>
<div id="hdr"></div>
<main id="conteudo">
  <section class="page-head">
    <div class="wrap">
      <nav aria-label="Você está em"><ol class="crumbs" id="crumbs"></ol></nav>
      <h1 class="sec-title" id="titulo">Loja</h1>
      <div class="filters" role="group" aria-label="Escolher o jogo" id="f-jogo"></div>
    </div>
  </section>

  <section class="band" aria-labelledby="titulo">
    <div class="panel light">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Tipo de produto" id="f-tipo" style="margin:0"></div>
        <label class="field" for="busca">Buscar
          <input class="input" type="search" id="busca" placeholder="Nome da carta, coleção ou produto" autocomplete="off">
        </label>
        <label class="field" for="ordem" style="flex:0 1 220px">Ordenar
          <select class="input" id="ordem">
            <option value="novos">Mais recentes</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
            <option value="nome">Nome (A a Z)</option>
          </select>
        </label>
      </div>
      <p id="contagem" role="status" aria-live="polite" style="margin:0 0 24px;color:var(--light-muted);font-weight:600"></p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="agenda" aria-label="Não achou">
    <div class="wrap" style="align-items:center">
      <p class="big-line" style="flex:1 1 420px">Não achou o que procurava? A loja procura pra você.</p>
      <a class="btn btn-ink" href="index.html#lista">Ir pra lista de desejos</a>
    </div>
  </section>
</main>
<div id="ftr"></div>

<script src="assets/arena.js?v=20261019c"></script>
<script>
(async function () {
  mountChrome('loja');
  await nomesJogos();
  const _todos = await DB.produtos();
  const _js = await DB.jogos();
  const jogos = _js.filter((j) => _todos.some((p) => p.jogo === j.id)).length ? _js.filter((j) => _todos.some((p) => p.jogo === j.id)) : _js;
  const qs = new URLSearchParams(location.search);
  const st = { jogo: qs.get('jogo') || '', tipo: qs.get('tipo') || '', busca: qs.get('busca') || '', ordem: 'novos' };
  if (st.jogo && !jogos.some((j) => j.id === st.jogo)) st.jogo = '';
  const TIPOS = [['', 'Tudo'], ['lacrado', 'Lacrados'], ['carta', 'Cartas avulsas']];

  function chips() {
    $('#f-jogo').innerHTML = [['', 'Todos os jogos'], ...jogos.map((j) => [j.id, j.nome])].map(([v, t]) => `<button type="button" class="chip" data-jogo="${esc(v)}" aria-pressed="${st.jogo === v}">${esc(t)}</button>`).join('');
    $('#f-tipo').innerHTML = TIPOS.map(([v, t]) => `<button type="button" class="chip chip-light" data-tipo="${v}" aria-pressed="${st.tipo === v}">${t}</button>`).join('');
    const jn = st.jogo ? _jogosNome[st.jogo] : '', tn = (TIPOS.find((t) => t[0] === st.tipo) || [])[1];
    $('#titulo').textContent = jn ? jn : 'Loja';
    document.title = (jn ? jn + ' · ' : '') + 'Loja · Arena Prime';
    $('#crumbs').innerHTML = `<li><a href="index.html">Início</a></li><li>${st.jogo || st.tipo ? '<a href="loja.html">Loja</a>' : '<span aria-current="page">Loja</span>'}</li>`
      + (jn ? `<li>${st.tipo ? `<a href="loja.html?jogo=${st.jogo}">${esc(jn)}</a>` : `<span aria-current="page">${esc(jn)}</span>`}</li>` : '')
      + (st.tipo ? `<li><span aria-current="page">${tn}</span></li>` : '');
  }
  async function lista() {
    const ps = await DB.produtos({ jogo: st.jogo || undefined, tipo: st.tipo || undefined, busca: st.busca, ordem: st.ordem });
    $('#grid').innerHTML = ps.map(itemHTML).join('') || '<p class="empty" style="grid-column:1/-1">Nada encontrado com esses filtros. Tenta outro jogo ou outra busca, ou pede na lista de desejos.</p>';
    $('#contagem').textContent = ps.length === 1 ? '1 produto' : ps.length + ' produtos';
    const p = new URLSearchParams(); if (st.jogo) p.set('jogo', st.jogo); if (st.tipo) p.set('tipo', st.tipo); if (st.busca) p.set('busca', st.busca);
    history.replaceState(null, '', 'loja.html' + (p.toString() ? '?' + p : ''));
  }
  document.addEventListener('click', (e) => {
    const j = e.target.closest('[data-jogo]'), t = e.target.closest('[data-tipo]');
    if (j) { st.jogo = j.dataset.jogo; chips(); lista(); $(`[data-jogo="${st.jogo}"]`).focus(); }
    if (t) { st.tipo = t.dataset.tipo; chips(); lista(); $(`[data-tipo="${st.tipo}"]`).focus(); }
  });
  let tm; $('#busca').value = st.busca;
  $('#busca').addEventListener('input', (e) => { clearTimeout(tm); tm = setTimeout(() => { st.busca = e.target.value.trim(); lista(); }, 220); });
  $('#ordem').addEventListener('change', (e) => { st.ordem = e.target.value; lista(); });
  chips(); lista();
  if (location.hash === '#busca') $('#busca').focus();
})();
</script>
</body>
</html>
